<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fight on a Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.6); padding: 12px; border-radius: 6px; user-select: none; }
        #health-bar { width: 200px; height: 18px; background: #555; border: 2px solid #fff; margin-top: 5px; }
        #health-fill { width: 100%; height: 100%; background: #00ff44; transition: width 0.15s; }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; display: none; font-size: 24px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="ui">
        <div>HEALTH: <span id="hp-text">100</span>/100</div>
        <div id="health-bar"><div id="health-fill"></div></div>
        <div style="margin-top: 8px; font-size: 11px;">[Shift] ShiftLock | [E] Dash | [L-Click] Attack | [WASD] Move</div>
    </div>
    <div id="crosshair">+</div>

    <!-- Three.js & Firebase CDN SDKs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_SvBpe0aTMzq_sFvbmS9VkrbwXRMr560",
            authDomain: "fight-on-a-baseplate.firebaseapp.com",
            projectId: "fight-on-a-baseplate",
            storageBucket: "fight-on-a-baseplate.firebasestorage.app",
            messagingSenderId: "948839520599",
            appId: "1:948839520599:web:6014ca48b555703dfbc612",
            measurementId: "G-BBSCF1VBP2",
            databaseURL: "https://fight-on-a-baseplate-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Session ID for this player instance
        const myId = 'player_' + Math.floor(Math.random() * 1000000);
        const playerRef = db.ref('players/' + myId);
        const playersRef = db.ref('players');

        // Clean up player on tab close
        playerRef.onDisconnect().remove();

        const myData = {
            x: (Math.random() - 0.5) * 20,
            y: 0,
            z: (Math.random() - 0.5) * 20,
            rotY: 0,
            health: 100
        };
        playerRef.set(myData);

        // --- 2. THREE.JS SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x68b0d8);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(50, 100, 50);
        scene.add(sun, new THREE.AmbientLight(0x707070));

        // Roblox Baseplate
        const baseplate = new THREE.Mesh(
            new THREE.BoxGeometry(200, 2, 200),
            new THREE.MeshStandardMaterial({ color: 0x666666, roughness: 0.8 })
        );
        baseplate.position.y = -1;
        scene.add(baseplate);

        const grid = new THREE.GridHelper(200, 40, 0x000000, 0x444444);
        grid.position.y = 0.01;
        scene.add(grid);

        // Blocky Roblox Character
        function createAvatar(color) {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: color || 0x00a2ff });
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.6), mat);
            torso.position.y = 1.2;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), new THREE.MeshStandardMaterial({ color: 0xffcc00 }));
            head.position.y = 2.15;
            group.add(head);

            const sword = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.8, 0.2), new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8 }));
            sword.position.set(0.8, 1.2, -0.4);
            sword.rotation.x = Math.PI / 4;
            group.add(sword);
            group.sword = sword;

            return group;
        }

        const player = createAvatar(0x00ffcc);
        player.position.set(myData.x, myData.y, myData.z);
        scene.add(player);

        const remotePlayers = {};

        // --- 3. CONTROLS & COMBAT ---
        let isShiftLock = false;
        let health = 100;
        let canDash = true;
        let isSwinging = false;
        let velocityY = 0;
        let isGrounded = true;

        const keys = {};
        let mouseYaw = 0;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') toggleShiftLock();
            if (e.code === 'KeyE' && canDash) triggerDash();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        document.addEventListener('mousemove', (e) => {
            if (isShiftLock && document.pointerLockElement === document.body) {
                mouseYaw -= e.movementX * 0.003;
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !isSwinging) attack();
        });

        function toggleShiftLock() {
            isShiftLock = !isShiftLock;
            document.getElementById('crosshair').style.display = isShiftLock ? 'block' : 'none';
            if (isShiftLock) document.body.requestPointerLock();
            else if (document.pointerLockElement) document.exitPointerLock();
        }

        function triggerDash() {
            canDash = false;
            const dashDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            player.position.addScaledVector(dashDir, 6);
            setTimeout(() => canDash = true, 1000);
        }

        function attack() {
            isSwinging = true;
            const origRot = player.sword.rotation.x;
            player.sword.rotation.x = -Math.PI / 2;

            for (let id in remotePlayers) {
                const target = remotePlayers[id];
                if (player.position.distanceTo(target.position) < 3.5) {
                    const targetRef = db.ref('players/' + id);
                    targetRef.once('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data) {
                            const newHealth = Math.max(0, data.health - 10);
                            targetRef.update({ health: newHealth });
                        }
                    });
                }
            }

            setTimeout(() => {
                player.sword.rotation.x = origRot;
                isSwinging = false;
            }, 250);
        }

        // --- 4. REALTIME DATABASE SYNC ---
        playersRef.on('child_added', (snapshot) => {
            const id = snapshot.key;
            if (id !== myId) {
                const data = snapshot.val();
                const remote = createAvatar(0xff3333);
                remote.position.set(data.x, data.y, data.z);
                remote.rotation.y = data.rotY;
                scene.add(remote);
                remotePlayers[id] = remote;
            }
        });

        playersRef.on('child_changed', (snapshot) => {
            const id = snapshot.key;
            const data = snapshot.val();

            if (id === myId) {
                if (data.health !== undefined && data.health !== health) {
                    health = data.health;
                    document.getElementById('hp-text').innerText = health;
                    document.getElementById('health-fill').style.width = health + '%';

                    if (health <= 0) {
                        health = 100;
                        player.position.set((Math.random() - 0.5) * 20, 0, (Math.random() - 0.5) * 20);
                        document.getElementById('hp-text').innerText = 100;
                        document.getElementById('health-fill').style.width = '100%';
                        playerRef.update({
                            x: player.position.x,
                            y: player.position.y,
                            z: player.position.z,
                            health: 100
                        });
                    }
                }
            } else if (remotePlayers[id]) {
                remotePlayers[id].position.set(data.x, data.y, data.z);
                remotePlayers[id].rotation.y = data.rotY;
            }
        });

        playersRef.on('child_removed', (snapshot) => {
            const id = snapshot.key;
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id]);
                delete remotePlayers[id];
            }
        });

        // --- 5. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.2;
            let moveDir = new THREE.Vector3();

            if (keys['KeyW']) moveDir.z -= 1;
            if (keys['KeyS']) moveDir.z += 1;
            if (keys['KeyA']) moveDir.x -= 1;
            if (keys['KeyD']) moveDir.x += 1;

            moveDir.normalize();

            if (isShiftLock) {
                player.rotation.y = mouseYaw;
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), mouseYaw);
            } else if (moveDir.length() > 0) {
                player.rotation.y = Math.atan2(-moveDir.x, -moveDir.z);
            }

            player.position.x += moveDir.x * speed;
            player.position.z += moveDir.z * speed;

            // Jump / Gravity
            if (keys['Space'] && isGrounded) {
                velocityY = 0.25;
                isGrounded = false;
            }
            player.position.y += velocityY;
            if (player.position.y > 0) {
                velocityY -= 0.015;
            } else {
                player.position.y = 0;
                velocityY = 0;
                isGrounded = true;
            }

            // Camera Tracking
            const camOffset = new THREE.Vector3(isShiftLock ? 1.5 : 0, 4, 8);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), isShiftLock ? mouseYaw : player.rotation.y);
            camera.position.copy(player.position).add(camOffset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.5, 0)));

            // Broadcast transform
            playerRef.update({
                x: player.position.x,
                y: player.position.y,
                z: player.position.z,
                rotY: player.rotation.y
            });

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
