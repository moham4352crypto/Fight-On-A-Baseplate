<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fight on a Baseplate</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: monospace; user-select: none; }
        
        /* UI HUD */
        #ui { position: absolute; top: 15px; left: 15px; color: white; background: rgba(0,0,0,0.65); padding: 12px 16px; border-radius: 6px; pointer-events: none; z-index: 10; }
        #health-bar { width: 220px; height: 18px; background: #333; border: 2px solid #fff; margin-top: 6px; border-radius: 3px; }
        #health-fill { width: 100%; height: 100%; background: #02e039; transition: width 0.15s; }
        
        /* Kill Feed */
        #killfeed { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; pointer-events: none; z-index: 10; }
        .kill-msg { background: rgba(0,0,0,0.75); color: #ff4444; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 13px; border-right: 3px solid #ff4444; animation: fadeOut 4.5s forwards; }

        /* Respawn Overlay */
        #respawn-screen { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); display: none; flex-direction: column; justify-content: center; align-items: center; color: white; z-index: 20; }
        #respawn-screen h1 { font-size: 42px; margin: 0; color: #ff3333; }
        #respawn-screen p { font-size: 20px; margin-top: 10px; }

        /* Damage Numbers (Normal & Crit) */
        .damage-pop { position: absolute; font-weight: 900; pointer-events: none; animation: floatUp 0.75s ease-out forwards; z-index: 15; }
        .damage-pop.normal { color: #ffcc00; font-size: 26px; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; }
        .damage-pop.crit { color: #ff2200; font-size: 34px; text-shadow: 0 0 10px rgba(255, 34, 0, 0.8), 2px 2px 0 #000, -2px -2px 0 #000; }

        /* Reticles */
        #shiftlock-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 14px; height: 14px; border: 2px solid cyan; border-radius: 50%; display: none; pointer-events: none; z-index: 5; }

        @keyframes floatUp {
            0% { transform: translate(-50%, 0) scale(1.3); opacity: 1; }
            50% { transform: translate(-50%, -35px) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -65px) scale(0.7); opacity: 0; }
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="ui">
        <div>HEALTH: <span id="hp-text">100</span>/100</div>
        <div id="health-bar"><div id="health-fill"></div></div>
        <div style="margin-top: 8px; font-size: 11px; opacity: 0.9;">
            [Shift] Shift Lock | [Right-Click Drag] Orbit | [Scroll] Zoom<br>
            [WASD] Camera-Relative Move | [E] Dash | [L-Click] Attack<br>
            <span style="color: #ffcc00;">[Jump + Attack] = CRIT HIT (15 DMG)</span>
        </div>
    </div>

    <div id="killfeed"></div>
    <div id="shiftlock-icon"></div>

    <div id="respawn-screen">
        <h1>YOU DIED</h1>
        <p>Respawning in <span id="respawn-timer">3</span>...</p>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // --- 1. FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyD_SvBpe0aTMzq_sFvbmS9VkrbwXRMr560",
            authDomain: "fight-on-a-baseplate.firebaseapp.com",
            projectId: "fight-on-a-baseplate",
            storageBucket: "fight-on-a-baseplate.firebasestorage.app",
            messagingSenderId: "948839520599",
            appId: "1:948839520599:web:6014ca48b555703dfbc612",
            measurementId: "G-BBSCF1VBP2",
            databaseURL: "https://fight-on-a-baseplate-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myId = 'Player_' + Math.floor(1000 + Math.random() * 9000);
        const playerRef = db.ref('players/' + myId);
        const playersRef = db.ref('players');
        playerRef.onDisconnect().remove();

        const BASEPLATE_SIZE = 250;
        const HALF_BASEPLATE = BASEPLATE_SIZE / 2;

        const spawnPos = {
            x: (Math.random() - 0.5) * 30,
            y: 0,
            z: (Math.random() - 0.5) * 30,
            rotY: 0,
            health: 100,
            kbX: 0,
            kbZ: 0,
            kbY: 0
        };
        playerRef.set(spawnPos);

        // --- 2. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const sun = new THREE.DirectionalLight(0xffffff, 1.1);
        sun.position.set(60, 120, 40);
        sun.castShadow = true;
        scene.add(sun, new THREE.AmbientLight(0x909090));

        // Baseplate
        const baseplate = new THREE.Mesh(
            new THREE.BoxGeometry(BASEPLATE_SIZE, 2, BASEPLATE_SIZE),
            new THREE.MeshStandardMaterial({ color: 0x636363, roughness: 0.7 })
        );
        baseplate.position.y = -1;
        baseplate.receiveShadow = true;
        scene.add(baseplate);

        const grid = new THREE.GridHelper(BASEPLATE_SIZE, 50, 0x222222, 0x444444);
        grid.position.y = 0.01;
        scene.add(grid);

        // Roblox Avatar Builder
        function createRobloxR6(shirtColor = 0x00a2ff, legColor = 0x111111) {
            const avatar = new THREE.Group();

            const torsoMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const headMat = new THREE.MeshStandardMaterial({ color: 0xf5cd2f });
            const legMat = new THREE.MeshStandardMaterial({ color: legColor });
            const armMat = new THREE.MeshStandardMaterial({ color: shirtColor });
            const steelMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.8, roughness: 0.2 });

            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), torsoMat);
            torso.position.y = 3;
            torso.castShadow = true;
            avatar.add(torso);

            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), headMat);
            head.position.y = 4.6;
            head.castShadow = true;
            avatar.add(head);

            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-1.5, 4, 0);
            const leftArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            leftArm.position.y = -1;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);
            avatar.add(leftArmGroup);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(1.5, 4, 0);
            const rightArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), armMat);
            rightArm.position.y = -1;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);

            const swordGroup = new THREE.Group();
            swordGroup.position.set(0, -1.8, -0.2);
            swordGroup.rotation.x = Math.PI / 3;
            const blade = new THREE.Mesh(new THREE.BoxGeometry(0.15, 2.5, 0.3), steelMat);
            blade.position.y = -1.2;
            swordGroup.add(blade);
            rightArmGroup.add(swordGroup);

            avatar.add(rightArmGroup);

            const leftLegGroup = new THREE.Group();
            leftLegGroup.position.set(-0.55, 2, 0);
            const leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            leftLeg.position.y = -1;
            leftLeg.castShadow = true;
            leftLegGroup.add(leftLeg);
            avatar.add(leftLegGroup);

            const rightLegGroup = new THREE.Group();
            rightLegGroup.position.set(0.55, 2, 0);
            const rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.9, 2, 1), legMat);
            rightLeg.position.y = -1;
            rightLeg.castShadow = true;
            rightLegGroup.add(rightLeg);
            avatar.add(rightLegGroup);

            avatar.rig = { leftArmGroup, rightArmGroup, leftLegGroup, rightLegGroup, swordGroup };
            return avatar;
        }

        const player = createRobloxR6(0x00a2ff, 0x1b2a4a);
        player.position.set(spawnPos.x, 0, spawnPos.z);
        scene.add(player);

        const remotePlayers = {};

        // --- 3. CONTROLS & GAMEPLAY VARS ---
        let isShiftLock = false;
        let isRightMouseDown = false;
        let camYaw = 0;
        let camPitch = -0.25;
        let camDistance = 12;

        let health = 100;
        let isDead = false;
        let canDash = true;
        let isSwinging = false;
        let walkCycleTime = 0;
        let velocityY = 0;
        let isGrounded = true;

        // Knockback Impulse Physics
        let kbVelX = 0;
        let kbVelZ = 0;

        const keys = {};

        document.addEventListener('keydown', (e) => {
            if (isDead) return;
            keys[e.code] = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') toggleShiftLock();
            if (e.code === 'KeyE' && canDash) triggerDash();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        document.addEventListener('mousedown', (e) => {
            if (isDead) return;
            if (e.button === 2) isRightMouseDown = true;
            if (e.button === 0 && !isSwinging) attack();
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 2) isRightMouseDown = false;
        });
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('mousemove', (e) => {
            if (isShiftLock || isRightMouseDown) {
                camYaw -= e.movementX * 0.0035;
                camPitch = Math.max(-1.2, Math.min(1.2, camPitch - e.movementY * 0.0035));
            }
        });

        document.addEventListener('wheel', (e) => {
            camDistance = Math.max(4, Math.min(30, camDistance + e.deltaY * 0.012));
        });

        function toggleShiftLock() {
            isShiftLock = !isShiftLock;
            document.getElementById('shiftlock-icon').style.display = isShiftLock ? 'block' : 'none';
            if (isShiftLock) document.body.requestPointerLock();
            else if (document.pointerLockElement) document.exitPointerLock();
        }

        function triggerDash() {
            canDash = false;
            const forwardDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            player.position.addScaledVector(forwardDir, 8);
            setTimeout(() => canDash = true, 800);
        }

        // --- 4. FLOATING DAMAGE & KILL FEED UI ---
        function spawnDamagePop(position3D, amount = 10, isCrit = false) {
            const vec = position3D.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.8, 3.5, (Math.random() - 0.5) * 0.8));
            vec.project(camera);

            const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(vec.y * 0.5) + 0.5) * window.innerHeight;

            const pop = document.createElement('div');
            pop.className = `damage-pop ${isCrit ? 'crit' : 'normal'}`;
            pop.innerText = isCrit ? `-${amount} CRIT!` : `-${amount}`;
            pop.style.left = `${x}px`;
            pop.style.top = `${y}px`;

            document.body.appendChild(pop);
            setTimeout(() => pop.remove(), 750);
        }

        function addKillFeed(message) {
            const feed = document.getElementById('killfeed');
            const msg = document.createElement('div');
            msg.className = 'kill-msg';
            msg.innerText = message;
            feed.appendChild(msg);
            setTimeout(() => msg.remove(), 4500);
        }

        // --- 5. COMBAT & ATTACK (CRITS & MAX REACH) ---
        function attack() {
            isSwinging = true;
            const originalRotX = player.rig.rightArmGroup.rotation.x;
            player.rig.rightArmGroup.rotation.x = -Math.PI / 1.5;

            // Crit Check: Jump Attack deals 15 damage
            const isCrit = !isGrounded;
            const damage = isCrit ? 15 : 10;

            // Maximum reach: Ground = 4.2 units | In Sky = 2.6 units (harder to hit back when launched)
            const maxReach = isGrounded ? 4.2 : 2.6;

            for (let id in remotePlayers) {
                const target = remotePlayers[id];
                const dist = player.position.distanceTo(target.position);

                if (dist <= maxReach) {
                    const kbDir = target.position.clone().sub(player.position).normalize();
                    const knockbackForce = 1.7;
                    const upwardPopForce = 0.32; // Air launch

                    // Instant visual push on attacker screen
                    target.position.x += kbDir.x * knockbackForce;
                    target.position.z += kbDir.z * knockbackForce;
                    target.position.y += 0.5;

                    spawnDamagePop(target.position, damage, isCrit);

                    const targetRef = db.ref('players/' + id);
                    targetRef.once('value', (snapshot) => {
                        const data = snapshot.val();
                        if (data && data.health > 0) {
                            const newHealth = Math.max(0, data.health - damage);
                            targetRef.update({ 
                                health: newHealth,
                                kbX: kbDir.x * knockbackForce,
                                kbZ: kbDir.z * knockbackForce,
                                kbY: upwardPopForce // Pop into air
                            });
                        }
                    });
                }
            }

            setTimeout(() => {
                player.rig.rightArmGroup.rotation.x = originalRotX;
                isSwinging = false;
            }, 250);
        }

        // --- 6. RESPAWN SYSTEM ---
        function triggerRespawn() {
            isDead = true;
            player.visible = false;
            if (document.pointerLockElement) document.exitPointerLock();

            const respawnScreen = document.getElementById('respawn-screen');
            const timerText = document.getElementById('respawn-timer');
            respawnScreen.style.display = 'flex';

            let count = 3;
            timerText.innerText = count;

            const countdown = setInterval(() => {
                count--;
                timerText.innerText = count;
                if (count <= 0) {
                    clearInterval(countdown);
                    respawnScreen.style.display = 'none';

                    // Reset Player State
                    health = 100;
                    isDead = false;
                    velocityY = 0;
                    kbVelX = 0;
                    kbVelZ = 0;
                    isGrounded = true;
                    player.visible = true;
                    player.position.set((Math.random() - 0.5) * 30, 0, (Math.random() - 0.5) * 30);
                    
                    document.getElementById('hp-text').innerText = 100;
                    document.getElementById('health-fill').style.width = '100%';

                    playerRef.update({
                        x: player.position.x,
                        y: 0,
                        z: player.position.z,
                        health: 100,
                        kbX: 0,
                        kbZ: 0,
                        kbY: 0
                    });
                }
            }, 1000);
        }

        // --- 7. REALTIME DATABASE NETWORK SYNC ---
        playersRef.on('child_added', (snapshot) => {
            const id = snapshot.key;
            if (id !== myId) {
                const data = snapshot.val();
                const remote = createRobloxR6(0xe74c3c, 0x2c3e50);
                remote.position.set(data.x, data.y || 0, data.z);
                remote.rotation.y = data.rotY;
                scene.add(remote);
                remotePlayers[id] = remote;
            }
        });

        playersRef.on('child_changed', (snapshot) => {
            const id = snapshot.key;
            const data = snapshot.val();

            if (id === myId) {
                // Apply impulses from hits
                if (data.kbX || data.kbZ || data.kbY) {
                    kbVelX = data.kbX || 0;
                    kbVelZ = data.kbZ || 0;
                    
                    if (data.kbY) {
                        velocityY = data.kbY; // Launch into air
                        isGrounded = false;
                    }

                    playerRef.update({ kbX: 0, kbZ: 0, kbY: 0 });
                }

                if (data.health !== undefined && data.health !== health) {
                    if (data.health < health) {
                        const dmgTaken = health - data.health;
                        spawnDamagePop(player.position, dmgTaken, dmgTaken > 10);
                    }

                    health = data.health;
                    document.getElementById('hp-text').innerText = health;
                    document.getElementById('health-fill').style.width = health + '%';

                    if (health <= 0 && !isDead) {
                        addKillFeed(`${myId} was defeated`);
                        triggerRespawn();
                    }
                }
            } else if (remotePlayers[id]) {
                if (data.health <= 0 && remotePlayers[id].visible) {
                    remotePlayers[id].visible = false;
                } else if (data.health > 0 && !remotePlayers[id].visible) {
                    remotePlayers[id].visible = true;
                }

                remotePlayers[id].position.set(data.x, data.y || 0, data.z);
                remotePlayers[id].rotation.y = data.rotY;
            }
        });

        playersRef.on('child_removed', (snapshot) => {
            const id = snapshot.key;
            if (remotePlayers[id]) {
                scene.remove(remotePlayers[id]);
                delete remotePlayers[id];
            }
        });

        // --- 8. MAIN ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isDead) {
                // Apply Knockback Friction Impulse
                player.position.x += kbVelX;
                player.position.z += kbVelZ;
                kbVelX *= 0.82;
                kbVelZ *= 0.82;

                // WASD Input Vector
                let inputZ = 0, inputX = 0;
                if (keys['KeyW']) inputZ -= 1;
                if (keys['KeyS']) inputZ += 1;
                if (keys['KeyA']) inputX -= 1;
                if (keys['KeyD']) inputX += 1;

                const isMoving = inputZ !== 0 || inputX !== 0;

                if (isMoving) {
                    const moveInput = new THREE.Vector3(inputX, 0, inputZ).normalize();
                    
                    const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
                    const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));

                    const moveDir = new THREE.Vector3()
                        .addScaledVector(forward, -moveInput.z)
                        .addScaledVector(right, moveInput.x)
                        .normalize();

                    const speed = 0.28;
                    player.position.x += moveDir.x * speed;
                    player.position.z += moveDir.z * speed;

                    if (!isShiftLock) {
                        player.rotation.y = Math.atan2(moveDir.x, moveDir.z);
                    }
                }

                if (isShiftLock) {
                    player.rotation.y = camYaw;
                }

                // Check Baseplate Boundary Limits (Void Physics)
                const isOnBaseplate = Math.abs(player.position.x) <= HALF_BASEPLATE && Math.abs(player.position.z) <= HALF_BASEPLATE;

                if (keys['Space'] && isGrounded && isOnBaseplate) {
                    velocityY = 0.32;
                    isGrounded = false;
                }

                player.position.y += velocityY;

                if (isOnBaseplate && player.position.y <= 0) {
                    player.position.y = 0;
                    velocityY = 0;
                    isGrounded = true;
                } else {
                    // Gravity applies freely when airborne or off baseplate
                    velocityY -= 0.018;
                    isGrounded = false;
                }

                // Void Death Detection
                if (player.position.y < -35 && !isDead) {
                    health = 0;
                    document.getElementById('hp-text').innerText = 0;
                    document.getElementById('health-fill').style.width = '0%';
                    playerRef.update({ health: 0 });
                    addKillFeed(`${myId} fell into the void`);
                    triggerRespawn();
                }

                // Limb Swinging Animation
                if (isMoving && isGrounded) {
                    walkCycleTime += 0.18;
                    const swing = Math.sin(walkCycleTime) * 0.7;
                    player.rig.leftArmGroup.rotation.x = swing;
                    if (!isSwinging) player.rig.rightArmGroup.rotation.x = -swing;
                    player.rig.leftLegGroup.rotation.x = -swing;
                    player.rig.rightLegGroup.rotation.x = swing;
                } else {
                    walkCycleTime = 0;
                    player.rig.leftArmGroup.rotation.x = 0;
                    if (!isSwinging) player.rig.rightArmGroup.rotation.x = 0;
                    player.rig.leftLegGroup.rotation.x = 0;
                    player.rig.rightLegGroup.rotation.x = 0;
                }

                // Sync Position to Firebase
                playerRef.update({
                    x: player.position.x,
                    y: player.position.y,
                    z: player.position.z,
                    rotY: player.rotation.y
                });
            }

            // Roblox Camera Following
            const targetCenter = player.position.clone().add(new THREE.Vector3(0, 3, 0));
            if (isShiftLock) {
                const shoulderOffset = new THREE.Vector3(1.2, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camYaw);
                targetCenter.add(shoulderOffset);
            }

            const camX = targetCenter.x + camDistance * Math.sin(camYaw) * Math.cos(camPitch);
            const camY = targetCenter.y + camDistance * -Math.sin(camPitch);
            const camZ = targetCenter.z + camDistance * Math.cos(camYaw) * Math.cos(camPitch);

            camera.position.set(camX, Math.max(-20, camY), camZ);
            camera.lookAt(targetCenter);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
